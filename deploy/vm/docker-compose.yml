name: knowledgevine

services:
  db:
    image: postgres:18.6
    container_name: knowledge-db
    restart: unless-stopped
    env_file: ./.local/vm/postgres.env
    volumes:
      - knowledgevine-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      knowledge-network:
        ipv4_address: 172.28.88.30

  api:
    build: ./api
    container_name: knowledge-api
    restart: unless-stopped
    env_file: ./.local/vm/api.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8082
      Portal__LocalDatabaseOnly: "false"
      Portal__DataProtectionKeyPath: /var/lib/knowledgevine/keys
      Portal__PublicUrl: http://127.0.0.1:8803
      Portal__TrustedProxyAddresses__0: 172.28.88.10
      Portal__Mail__Mode: Smtp
      Portal__Mail__PreviewInvitations: "true"
      Portal__Mail__AllowedRecipients__0: anrich@knowledgevinemontessori.co.za
      # Portal SMTP uses the copied school settings; contact-form test delivery stays off.
      EmailSettings__ContactEnabled: "false"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./.local/vm/portal:/var/lib/knowledgevine
    depends_on:
      db:
        condition: service_healthy
    networks:
      knowledge-network:
        ipv4_address: 172.28.88.20

  web:
    build: ./webapp
    container_name: knowledge-web
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./webapp/knowledevinefront/browser:/usr/share/nginx/html:ro
      - ./webapp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      knowledge-network:
        ipv4_address: 172.28.88.10

networks:
  knowledge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.88.0/24

volumes:
  knowledgevine-postgres:
