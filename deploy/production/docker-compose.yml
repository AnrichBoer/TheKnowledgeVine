name: knowledgevine
services:
  db:
    image: postgres:18.6
    container_name: knowledge-db
    restart: unless-stopped
    env_file:
      - path: ./.local/production/postgres.env
        format: raw
    volumes:
      - knowledgevine-postgres-production:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [knowledge-network]
  api:
    image: knowledgevine-api:${KNOWLEDGEVINE_RELEASE:?release required}
    build: ./releases/${KNOWLEDGEVINE_RELEASE}/api
    container_name: knowledge-api
    restart: unless-stopped
    env_file:
      - path: ./.local/production/api.env
        format: raw
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8082
      Portal__DataProtectionKeyPath: /var/lib/knowledgevine/keys
      Portal__PublicUrl: https://www.knowledgevinemontessori.co.za
      Portal__TrustedProxyAddresses__0: 172.20.0.1
      Portal__Mail__Mode: Smtp
      Portal__Mail__PreviewInvitations: "false"
      EmailSettings__ContactEnabled: "true"
    ports: ["127.0.0.1:8082:8082"]
    volumes:
      - ./.local/production/portal:/var/lib/knowledgevine
    depends_on:
      db:
        condition: service_healthy
    networks: [knowledge-network]
  web:
    image: knowledgevine-web:${KNOWLEDGEVINE_RELEASE:?release required}
    build:
      context: ./releases/${KNOWLEDGEVINE_RELEASE}/web
      args:
        WEB_BASE: knowledgevine-web:pre-${KNOWLEDGEVINE_RELEASE}
    container_name: knowledge-web
    restart: unless-stopped
    ports: ["127.0.0.1:8083:80"]
    volumes:
      - ./releases/${KNOWLEDGEVINE_RELEASE}/web/browser:/usr/share/nginx/html:ro
      - ./releases/${KNOWLEDGEVINE_RELEASE}/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [knowledge-network]
networks:
  knowledge-network:
    external: true
    name: knowledgevine_knowledge-network
volumes:
  knowledgevine-postgres-production:
    name: knowledgevine-postgres-production
