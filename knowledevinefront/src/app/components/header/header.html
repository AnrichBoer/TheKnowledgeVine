<header class="site-header">
  <div class="container header-row">
    <a class="brand" routerLink="/home" aria-label="Knowledge Vine Montessori home" (click)="closeMenu()">
      <img
        src="assets/images/logo-640.png"
        alt="Knowledge Vine Montessori — A Montessori Learning Community"
        width="640"
        height="178"
      />
    </a>

    <nav class="desktop-nav" aria-label="Primary navigation">
      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >Home</a>
      <a routerLink="/about" routerLinkActive="active">About Us</a>
      <a routerLink="/contact" routerLinkActive="active">Contact Us</a>
      <span class="portal-disabled" aria-disabled="true">
        Parent Portal
        <small>Coming soon</small>
      </span>
    </nav>

    <button
      class="menu-toggle"
      type="button"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="toggleMenu()"
    >
      <mat-icon aria-hidden="true">{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>

  <nav
    id="mobile-navigation"
    class="mobile-nav"
    [class.open]="menuOpen"
    [attr.aria-hidden]="!menuOpen"
    aria-label="Mobile navigation"
  >
    <div class="container mobile-nav-inner">
      <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Us</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact Us</a>
      <span class="portal-disabled" aria-disabled="true">
        Parent Portal
        <small>Coming soon</small>
      </span>
    </div>
  </nav>
</header>
