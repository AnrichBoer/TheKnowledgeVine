<header class="site-header">
  <div class="header-row">
    <a
      class="brand"
      routerLink="/home"
      aria-label="Knowledge Vine Montessori home"
      (click)="closeMenu()"
    >
      <img
        src="assets/images/knowledge-vine-brand.webp"
        alt="The Knowledge Vine Montessori"
        width="1039"
        height="378"
      />
    </a>
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      [attr.aria-label]="menuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
    >
      <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
    <nav
      id="main-navigation"
      aria-label="Main navigation"
      [class.open]="menuOpen()"
      (keydown.escape)="closeMenu()"
    >
      <a
        routerLink="/home"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >Home</a
      >
      <a
        routerLink="/about"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >About Us</a
      >
      <a
        routerLink="/contact"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >Contact Us</a
      >
      <a class="portal" routerLink="/portal/login" (click)="closeMenu()">Parent Portal <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
