<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to content</a>
<div class="main" [class.portal-shell]="portal()">
  @if (portal()) { <app-portal-tools /> }
  @if (!portal()) { <app-header /> }
  @if (!portal() && openDay.active()) {
    <aside class="open-day-banner" aria-label="Upcoming open day">
      <span
        ><strong>Come grow with us.</strong> Open Day · {{ openDay.event.shortDate }} ·
        {{ openDay.event.timeLabel }}</span
      >
      <button type="button" (click)="openDay.open()">
        Explore our open day <span aria-hidden="true">↗</span>
      </button>
    </aside>
  }
  <main id="main-content" tabindex="-1" class="content"><router-outlet /></main>
  @if (!portal()) { <app-footer /> }
</div>
