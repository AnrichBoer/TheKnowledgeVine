name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledevinefront/package-lock.json

      - name: Install
        working-directory: knowledevinefront
        run: npm ci

      - name: Build
        working-directory: knowledevinefront
        run: npm run build

      - name: Unit tests
        working-directory: knowledevinefront
        run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome

  api:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('KnowledgeVineAPI/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore KnowledgeVineAPI/KnowledgeVineAPI.sln

      - name: Build
        run: dotnet build KnowledgeVineAPI/KnowledgeVineAPI.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test KnowledgeVineAPI/KnowledgeVineAPI.sln --no-build --configuration Release
